[package]
name = "solana-leader-info"
description = "Solana leader info syscall API (SIMD-0558)"
documentation = "https://docs.rs/solana-leader-info"
version = "0.1.0"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[features]
bytemuck = ["dep:bytemuck", "dep:bytemuck_derive", "solana-address/bytemuck"]

[dependencies]
bytemuck = { workspace = true, optional = true }
bytemuck_derive = { workspace = true, optional = true }
solana-address = { workspace = true, features = ["copy"] }

[target.'cfg(any(target_os = "solana", target_arch = "bpf"))'.dependencies]
solana-define-syscall = { workspace = true }

[lints]
workspace = true
