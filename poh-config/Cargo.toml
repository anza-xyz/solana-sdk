[package]
name = "solana-poh-config"
description = "Definitions of Solana's proof of history."
documentation = "https://docs.rs/solana-poh-config"
version = "3.1.0"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[features]
frozen-abi = [
    "dep:solana-frozen-abi",
    "dep:solana-frozen-abi-macro",
    "solana-frozen-abi-macro/frozen-abi",
    "solana-frozen-abi/frozen-abi",
    "stable-abi",
]
serde = ["dep:serde", "dep:serde_derive"]
stable-abi = [
    "dep:solana-frozen-abi",
    "dep:solana-frozen-abi-macro",
    "serde",
    "solana-frozen-abi-macro/stable-abi",
    "solana-frozen-abi/stable-abi",
]
wincode = ["dep:wincode"]

[dependencies]
serde = { workspace = true, optional = true }
serde_derive = { workspace = true, optional = true }
solana-frozen-abi = { workspace = true, optional = true }
solana-frozen-abi-macro = { workspace = true, optional = true }
wincode = { workspace = true, optional = true }

[dev-dependencies]
solana-clock = { workspace = true }
solana-poh-config = { path = ".", features = ["wincode"] }
static_assertions = { workspace = true }

[lints]
workspace = true
