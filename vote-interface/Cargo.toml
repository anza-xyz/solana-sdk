[package]
name = "solana-vote-interface"
description = "Solana vote interface."
documentation = "https://docs.rs/solana-vote-interface"
version = "7.4.0"
rust-version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[features]
bincode = [
    "dep:bincode",
    "dep:solana-serialize-utils",
    "dep:solana-system-interface",
    "serde",
    "solana-instruction/bincode",
    "solana-system-interface/bincode",
]
dev-context-only-utils = [
    "dep:arbitrary",
    "dep:rand",
    "solana-pubkey/dev-context-only-utils",
]
frozen-abi = [
    "solana-frozen-abi-macro/frozen-abi",
    "solana-frozen-abi/frozen-abi",
    "solana-pubkey/frozen-abi",
    "stable-abi",
]
stable-abi = [
    "dep:rand",
    "serde",
    "solana-frozen-abi-macro/stable-abi",
    "solana-frozen-abi/stable-abi",
    "solana-pubkey/stable-abi",
]
serde = [
    "dep:cfg_eval",
    "dep:serde",
    "dep:serde_derive",
    "dep:serde_with",
    "serde/alloc",
    "solana-pubkey/serde",
]
wincode = [
    "dep:solana-serialize-utils",
    "dep:solana-system-interface",
    "dep:wincode",
    "solana-instruction/wincode",
    "solana-pubkey/wincode",
    "solana-system-interface/wincode",
    "wincode/alloc",
]

[dependencies]
arbitrary = { workspace = true, features = ["derive"], optional = true }
bincode = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["pod_saturating", "derive"] }
cfg_eval = { workspace = true, optional = true }
num-derive = { workspace = true }
num-traits = { workspace = true }
rand = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_derive = { workspace = true, optional = true }
serde_with = { workspace = true, features = ["macros"], optional = true }
solana-clock = { workspace = true }
solana-frozen-abi = { workspace = true, optional = true }
solana-frozen-abi-macro = { workspace = true, optional = true }
solana-instruction = { workspace = true, features = ["std"] }
solana-instruction-error = { workspace = true, features = ["num-traits"] }
solana-pubkey = { workspace = true, features = ["bytemuck"] }
solana-sdk-ids = { workspace = true }
solana-serialize-utils = { workspace = true, optional = true, features = ["std"] }
solana-system-interface = { workspace = true, optional = true }
wincode = { workspace = true, optional = true }

[target.'cfg(target_os = "solana")'.dependencies]
solana-serialize-utils = { workspace = true, features = ["std"] }

[dev-dependencies]
solana-epoch-schedule = { workspace = true }
solana-pubkey = { workspace = true, features = ["dev-context-only-utils"] }
solana-rent = { workspace = true }
solana-vote-interface = { path = ".", features = ["bincode", "dev-context-only-utils", "wincode"] }
test-case = { workspace = true }

[lints]
workspace = true
