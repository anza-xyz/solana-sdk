[package]
name = "solana-genesis-config"
description = "A Solana network's genesis config."
documentation = "https://docs.rs/solana-genesis-config"
version = "5.0.0"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[features]
frozen-abi = [
    "dep:solana-frozen-abi",
    "dep:solana-frozen-abi-macro",
    "solana-account/frozen-abi",
    "solana-cluster-type/frozen-abi",
    "solana-epoch-schedule/frozen-abi",
    "solana-fee-calculator/frozen-abi",
    "solana-inflation/frozen-abi",
    "solana-poh-config/frozen-abi",
    "solana-pubkey/frozen-abi",
    "solana-rent/frozen-abi",
    "solana-frozen-abi-macro/frozen-abi",
    "solana-frozen-abi/frozen-abi",
    "stable-abi",
]
serde = [
    "dep:bincode",
    "dep:serde",
    "dep:serde_derive",
    "solana-account/serde",
    "solana-clock/serde",
    "solana-cluster-type/serde",
    "solana-epoch-schedule/serde",
    "solana-fee-calculator/serde",
    "solana-inflation/serde",
    "solana-poh-config/serde",
    "solana-rent/serde",
]
stable-abi = [
    "dep:solana-frozen-abi",
    "dep:solana-frozen-abi-macro",
    "serde",
    "solana-account/stable-abi",
    "solana-cluster-type/stable-abi",
    "solana-epoch-schedule/stable-abi",
    "solana-fee-calculator/stable-abi",
    "solana-inflation/stable-abi",
    "solana-poh-config/stable-abi",
    "solana-pubkey/stable-abi",
    "solana-rent/stable-abi",
    "solana-frozen-abi-macro/stable-abi",
    "solana-frozen-abi/stable-abi",
]
wincode = [
    "dep:wincode",
    "solana-account/wincode",
    "solana-cluster-type/wincode",
    "solana-epoch-schedule/wincode",
    "solana-fee-calculator/wincode",
    "solana-inflation/wincode",
    "solana-poh-config/wincode",
    "solana-pubkey/wincode",
    "solana-rent/wincode",
    "wincode/alloc",
]

[dependencies]
bincode = { workspace = true, optional = true }
chrono = { workspace = true, features = ["alloc"] }
memmap2 = { workspace = true }
serde = { workspace = true, optional = true }
serde_derive = { workspace = true, optional = true }
solana-account = { workspace = true }
solana-clock = { workspace = true }
solana-cluster-type = { workspace = true }
solana-epoch-schedule = { workspace = true }
solana-fee-calculator = { workspace = true }
solana-frozen-abi = { workspace = true, optional = true }
solana-frozen-abi-macro = { workspace = true, optional = true }
solana-hash = { workspace = true }
solana-inflation = { workspace = true }
solana-keypair = { workspace = true }
solana-poh-config = { workspace = true }
solana-pubkey = { workspace = true }
solana-rent = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-sha256-hasher = { workspace = true, features = ["sha2"] }
solana-shred-version = { workspace = true }
solana-signer = { workspace = true }
solana-time-utils = { workspace = true }
wincode = { workspace = true, optional = true }

[dev-dependencies]
solana-genesis-config = { path = ".", features = ["serde", "wincode"] }
solana-pubkey = { workspace = true, features = ["rand"] }

[lints]
workspace = true
