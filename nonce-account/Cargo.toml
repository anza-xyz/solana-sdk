[package]
name = "solana-nonce-account"
description = "Solana nonce account utils."
documentation = "https://docs.rs/solana-nonce-account"
version = "4.3.0"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[features]
bincode = ["solana-account/bincode", "solana-nonce/serde"]
wincode = ["solana-account/wincode", "solana-nonce/wincode"]

[dependencies]
solana-account = { workspace = true }
solana-hash = { workspace = true }
solana-nonce = { workspace = true }
solana-sdk-ids = { workspace = true }

[dev-dependencies]
bincode = { workspace = true }
# Tests build accounts with the bincode constructors whichever codec the lib is built with.
solana-account = { workspace = true, features = ["bincode"] }
solana-fee-calculator = { workspace = true }
solana-nonce = { workspace = true, features = ["serde"] }
solana-nonce-account = { path = ".", features = ["wincode"] }
solana-pubkey = { workspace = true, features = ["std"] }
