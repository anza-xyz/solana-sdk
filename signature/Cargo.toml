[package]
name = "solana-signature"
description = "Solana 64-byte signature type"
documentation = "https://docs.rs/solana-signature"
version = "3.6.0"
rust-version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[features]
default = ["std", "alloc"]
alloc = ["wincode?/alloc"]
batch-verify = ["alloc", "verify", "solana-ed25519/alloc", "solana-ed25519/rand_core"]
bytemuck = ["dep:bytemuck", "dep:bytemuck_derive"]
# Run verify_simd0376 and ed25519-dalek's verify_strict alongside verify_dalek
# and report all three to an observer. See `triple_verify`.
triple-verify = ["std", "verify", "dep:ed25519-dalek"]
frozen-abi = [
    "solana-frozen-abi-macro/frozen-abi",
    "solana-frozen-abi/frozen-abi",
    "stable-abi",
    "std",
]
stable-abi = ["solana-frozen-abi-macro/stable-abi", "solana-frozen-abi/stable-abi"]
parallel = ["std", "batch-verify", "dep:rayon"]
rand = ["dep:rand"]
serde = ["dep:serde", "dep:serde_derive", "dep:serde-big-array"]
std = ["alloc", "serde?/std", "wincode?/std"]
verify = ["dep:solana-ed25519"]
wincode = ["dep:wincode"]

[dependencies]
bytemuck = { workspace = true, optional = true }
bytemuck_derive = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
five8 = { workspace = true }
rand = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde-big-array = { workspace = true, optional = true }
serde_derive = { workspace = true, optional = true }
solana-ed25519 = { workspace = true, optional = true }
solana-frozen-abi = { workspace = true, optional = true }
solana-frozen-abi-macro = { workspace = true, optional = true }
solana-sanitize = { workspace = true }
wincode = { workspace = true, optional = true }

[dev-dependencies]
bincode = { workspace = true }
bs58 = { workspace = true, features = ["std"] }
criterion = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
solana-ed25519 = { workspace = true, features = ["alloc"] }
solana-pubkey = { workspace = true, features = ["std"] }
solana-short-vec = { workspace = true, features = ["serde"] }
solana-signature = { path = ".", features = ["serde"] }

[lints]
workspace = true

[[bench]]
name = "verify"
harness = false
required-features = ["batch-verify"]
