[package]
name = "solana-frozen-abi-macro"
description = "Solana Frozen ABI Macro"
documentation = "https://docs.rs/solana-frozen-abi-macro"
version = "3.6.0"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[lib]
proc-macro = true

[features]
default = ["frozen-abi"]
# Generates the `AbiExample`/`AbiEnumVisitor` code for the api digester (`api_digest`).
frozen-abi = ["stable-abi"]
# Generates the `StableAbi` digester code for `abi_digest`.
stable-abi = []

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full", "extra-traits"] }

[lints]
workspace = true
