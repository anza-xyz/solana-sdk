[package]
name = "solana-epoch-rewards"
description = "Solana epoch rewards sysvar."
documentation = "https://docs.rs/solana-epoch-rewards"
version = "3.2.0"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[features]
frozen-abi = [
    "solana-frozen-abi-macro/frozen-abi",
    "solana-frozen-abi/frozen-abi",
    "solana-hash/frozen-abi",
    "stable-abi",
]
stable-abi = [
    "solana-frozen-abi-macro/stable-abi",
    "solana-frozen-abi/stable-abi",
    "solana-hash/stable-abi",
    "std",
]
serde = ["dep:serde", "dep:serde_derive", "serde/alloc", "solana-hash/serde"]
std = ["serde?/std"]
sysvar = ["dep:solana-get-sysvar", "dep:solana-sdk-ids", "dep:solana-sysvar-id"]
wincode = ["dep:wincode", "solana-hash/wincode"]

[dependencies]
serde = { workspace = true, optional = true }
serde_derive = { workspace = true, optional = true }
solana-frozen-abi = { workspace = true, optional = true }
solana-frozen-abi-macro = { workspace = true, optional = true }
solana-get-sysvar = { workspace = true, optional = true }
solana-hash = { workspace = true, features = ["decode"] }
solana-sdk-ids = { workspace = true, optional = true }
solana-sdk-macro = { workspace = true }
solana-sysvar-id = { workspace = true, optional = true }
wincode = { workspace = true, optional = true }

[dev-dependencies]
solana-epoch-rewards = { path = ".", features = ["sysvar", "wincode"] }

[lints]
workspace = true
