[package]
name = "solana-pubkey"
description = "Solana account addresses"
documentation = "https://docs.rs/solana-pubkey"
version = "4.4.0"
rust-version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[features]
borsh = ["solana-address/borsh"]
bytemuck = ["solana-address/bytemuck"]
curve25519 = ["solana-address/curve25519"]
default = ["std"]
dev-context-only-utils = [
    "dep:arbitrary",
    "solana-address/dev-context-only-utils",
]
frozen-abi = [
    "solana-address/frozen-abi",
    "solana-frozen-abi/frozen-abi",
    "solana-frozen-abi-macro/frozen-abi",
    "stable-abi",
]
stable-abi = [
    "serde",
    "std",
    "wincode",
    "solana-address/stable-abi",
    "solana-frozen-abi/stable-abi",
    "solana-frozen-abi-macro/stable-abi",
]
rand = ["dep:rand", "solana-address/rand"]
serde = ["dep:serde", "dep:serde_derive", "solana-address/serde"]
sha2 = ["solana-address/sha2"]
std = ["solana-address/atomic", "solana-address/std"]
alloc = ["solana-address/alloc"]
wincode = ["dep:wincode", "solana-address/wincode"]

[dependencies]
arbitrary = { workspace = true, features = ["derive"], optional = true }
rand = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_derive = { workspace = true, optional = true }
solana-address = { workspace = true, features = ["copy", "decode", "error", "sanitize", "syscalls"] }
solana-frozen-abi = { workspace = true, optional = true }
solana-frozen-abi-macro = { workspace = true, optional = true }
wincode = { workspace = true, optional = true }

[lints]
workspace = true
